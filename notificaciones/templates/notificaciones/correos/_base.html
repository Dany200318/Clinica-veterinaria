<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>{{ clinica_nombre }}</title></head>
<body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,Helvetica,sans-serif;color:#333;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:24px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;">
        <tr><td style="background:#4e54c8;color:#ffffff;padding:20px 28px;font-size:20px;font-weight:bold;">
          🐾 {{ clinica_nombre }}
        </td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
          {% block contenido %}{% endblock %}
        </td></tr>
        <tr><td style="background:#f0f1f7;padding:16px 28px;font-size:12px;color:#777;">
          {{ clinica_nombre }}{% if clinica_direccion %} · {{ clinica_direccion }}{% endif %}{% if clinica_telefono %} · Tel. {{ clinica_telefono }}{% endif %}<br>
          Este es un mensaje automático, por favor no responda a este correo.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
