{% if messages %}
<div class="mensajes">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {% if message.tags == 'success' %}<i class="bi bi-check-circle me-1"></i>{% elif message.tags == 'danger' %}<i class="bi bi-x-circle me-1"></i>{% elif message.tags == 'warning' %}<i class="bi bi-exclamation-triangle me-1"></i>{% else %}<i class="bi bi-info-circle me-1"></i>{% endif %}
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
