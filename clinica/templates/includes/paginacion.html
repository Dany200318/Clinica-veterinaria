{% if pagina.has_other_pages %}
<nav class="mt-3" aria-label="Paginación">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        {% if pagina.has_previous %}
        <li class="page-item"><a class="page-link" href="?{% if parametros_get %}{{ parametros_get }}&{% endif %}page=1">&laquo;</a></li>
        <li class="page-item"><a class="page-link" href="?{% if parametros_get %}{{ parametros_get }}&{% endif %}page={{ pagina.previous_page_number }}">Anterior</a></li>
        {% endif %}
        <li class="page-item active"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
        {% if pagina.has_next %}
        <li class="page-item"><a class="page-link" href="?{% if parametros_get %}{{ parametros_get }}&{% endif %}page={{ pagina.next_page_number }}">Siguiente</a></li>
        <li class="page-item"><a class="page-link" href="?{% if parametros_get %}{{ parametros_get }}&{% endif %}page={{ pagina.paginator.num_pages }}">&raquo;</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
